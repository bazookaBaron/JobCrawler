name: keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. Once a month, re-enable every scheduled workflow through the API
# (PUT .../actions/workflows/<file>/enable resets the inactivity timer). This
# needs only the built-in GITHUB_TOKEN with `actions: write`; no commits, no PAT.
# This workflow re-enables itself too, so it keeps itself alive.
on:
  schedule:
    - cron: "17 5 1 * *"      # 05:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in crawl-jobs.yml cleanup-stale-jobs.yml market-report.yml keepalive.yml; do
            if gh api -X PUT "repos/${REPO}/actions/workflows/${wf}/enable"; then
              echo "enabled ${wf}"
            else
              echo "::warning::could not enable ${wf} (missing or no access)"
            fi
          done
