name: cleanup-stale-jobs

# Daily (12:30 IST): snapshot market analytics, THEN hard-delete postings rows
# not seen by a crawl in RETAIN_DAYS (3) or posted more than 30 days ago. The snapshot step must run before hard-delete: once retention is
# down to 24h, public.jobs_market_snapshot_daily is the only surviving record
# of a day's activity, so it has to be captured before the source rows it's
# computed from get purged. FK cascades from crawler.job_posting are limited
# to nothing downstream (queue/board reference boards, not postings), so the
# delete is a plain DELETE. `crawl-jobs` runs the same age-cap delete every
# pass; this is the safety net if that workflow is paused.
on:
  schedule:
    - cron: "0 7 * * *"    # 12:30 IST daily, 30 min before the 13:00 IST crawl
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: crawler
    env:
      LOCAL_DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}
      PGPIPE_SCHEMA: crawler
      RETAIN_DAYS: "3"               # delete rows not seen by a crawl for N days
      MAX_POSTING_AGE_DAYS: "30"     # ...or posted (posted_at) more than N days ago

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Snapshot market analytics (must run before hard-delete)
        run: |
          set -euo pipefail
          uv run --no-sync jobs snapshot-market | tee ../snapshot.json

      - name: Hard-delete rows unseen for ${{ env.RETAIN_DAYS }}d or posted >${{ env.MAX_POSTING_AGE_DAYS }}d ago
        run: |
          set -euo pipefail
          uv run --no-sync jobs hard-delete --days "${RETAIN_DAYS}" | tee ../delete.json
          uv run --no-sync jobs prune | tee -a ../delete.json

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## cleanup-stale-jobs"
            echo '### snapshot-market'
            echo '```json'; cat ../snapshot.json 2>/dev/null || echo '{}'; echo '```'
            echo '```json'; cat ../delete.json 2>/dev/null || echo '{}'; echo '```'
            echo '### db stats'
            echo '```json'
            uv run --no-sync jobs stats 2>&1 || echo '{"stats":"unavailable"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
