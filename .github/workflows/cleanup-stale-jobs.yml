name: cleanup-stale-jobs

# Daily safety net + analytics snapshot:
#   1. snapshot-market  -> public.jobs_market_snapshot_daily (long-term record)
#   2. close-stale      -> close open rows unseen for 36h (30h for LinkedIn)
#   3. prune            -> keep the newest 400 OPEN rows per company (closes the rest)
#   4. retain           -> delete rows older than PGPIPE_KEEP_DAYS (2) (open or closed;
#                          remembered in crawler.seen_posting first), enforce the
#                          PGPIPE_MAX_ROWS cap, prune seen_posting after 45 days
#   5. build-feed       -> refresh crawler.job_feed after the changes above
# `crawl-jobs` performs 2-4 at the end of every pass; this workflow is the
# fallback if that one is paused, and the only place the daily snapshot is taken.
on:
  schedule:
    - cron: "27 23 * * *"    # daily, offset from the 12h crawl cron
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: crawler
    env:
      CRAWLER_DATABASE_URL: ${{ secrets.CRAWLER_DATABASE_URL || secrets.LOCAL_DATABASE_URL }}
      PGPIPE_SCHEMA: crawler
      PGPIPE_CLOSE_AFTER_HOURS: "36"
      PGPIPE_CLOSE_AFTER_HOURS_LINKEDIN: "30"
      PGPIPE_MAX_AGE_DAYS: "7"          # a CLOSED row is deleted after N days (or KEEP_DAYS)
      PGPIPE_KEEP_DAYS: "2"             # job_posting window; older rows -> seen_posting only
      PGPIPE_MAX_ROWS: "60000"          # safety cap on job_posting
      PGPIPE_SEEN_TTL_DAYS: "45"
      PGPIPE_PER_COMPANY_CAP: "400"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Snapshot market analytics
        run: |
          set -euo pipefail
          uv run --no-sync jobs snapshot-market | tee ../snapshot.json

      - name: Close stale, cap per company, expire old rows
        run: |
          set -euo pipefail
          uv run --no-sync jobs close-stale | tee ../cleanup.json
          uv run --no-sync jobs prune | tee -a ../cleanup.json
          uv run --no-sync jobs retain | tee -a ../cleanup.json

      - name: Rebuild feed
        run: |
          set -euo pipefail
          uv run --no-sync jobs build-feed | tee ../feed.json

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## cleanup-stale-jobs"
            echo '### snapshot-market'
            echo '```json'; cat ../snapshot.json 2>/dev/null || echo '{}'; echo '```'
            echo '### cleanup'
            echo '```json'; cat ../cleanup.json 2>/dev/null || echo '{}'; echo '```'
            echo '### build-feed'
            echo '```json'; cat ../feed.json 2>/dev/null || echo '{}'; echo '```'
            echo '### db stats'
            echo '```json'
            uv run --no-sync jobs stats 2>&1 || echo '{"stats":"unavailable"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
