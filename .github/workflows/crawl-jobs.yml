name: crawl-jobs

# $0 compute: one scheduled GitHub Actions job. Single process, NO Redis, no
# server. `jobs run` reclaims stale queue rows, enqueues every enabled board,
# crawls them with an in-process politeness gate, upserts compact rows into the
# dedicated `crawler` Postgres schema, then hard-deletes any posting older than
# 2 days (first_seen_at) and trims each company to its newest 400. The board
# only ever carries jobs from the last 2 days.
#
# CRON TUNING: every 6 hours is a starting point. Check the "crawl" step
# duration against RUN_MINUTES / the job timeout. ~516 boards at concurrency 12
# with ATS politeness (~0.6s per shared host) is roughly 5-12 min.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: crawler
    env:
      # Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
      LOCAL_DATABASE_URL: ${{ secrets.LOCAL_DATABASE_URL }}   # Supabase Postgres URI
      PGPIPE_SCHEMA: crawler
      PGPIPE_CONCURRENCY: "12"
      RUN_MINUTES: "20"
      # Crawl-budget split: ~70% of each pass goes to the big ATS providers
      # (greenhouse + workday), ~30% to the long tail. Both groups keep
      # draining; if one empties the other takes the whole remaining budget.
      PGPIPE_PRIORITY_MONITORS: "greenhouse,workday"
      PGPIPE_PRIORITY_WEIGHT: "0.7"
      # Board retention: keep only jobs first seen in the last N days; older
      # rows are hard-deleted at the end of every pass.
      PGPIPE_MAX_AGE_DAYS: "2"
      PGPIPE_CLOSE_AFTER_DAYS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Apply schema (idempotent)
        run: uv run --no-sync jobs migrate

      - name: Sync curated companies + boards (CSV -> Postgres)
        run: uv run --no-sync jobs sync | tee ../sync.json

      - name: Crawl (bounded) + close stale (3d) + prune per-company cap (400)
        run: |
          set -euo pipefail
          uv run --no-sync jobs run --minutes "${RUN_MINUTES}" | tee ../run.json

      - name: Job summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## crawl-jobs"
            echo
            echo '### sync'
            echo '```json'; cat ../sync.json 2>/dev/null || echo '{}'; echo '```'
            echo '### run'
            echo '```json'; cat ../run.json 2>/dev/null || echo '{}'; echo '```'
            echo '### db stats'
            echo '```json'
            uv run --no-sync jobs stats 2>&1 || echo '{"stats":"unavailable"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
